name: Analyze and build OhMyTest

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Check experimental plugin source and PHAR
    runs-on: ubuntu-24.04
    steps:
      - name: Check out OhMyTest
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out pinned Axolotl-PM source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: axolotl-pm/PocketMine-MP
          ref: dfe0d07e48a9e8d5a4a242fa43ff1cd3b743a955 # 5.49.1
          path: .devtools-dependencies/axolotl-pm
          persist-credentials: false

      - name: Check out Axolotl PHP setup helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: axolotl-pm/setup-php-action
          ref: b8c3f9add4f2ad4a5e2624a1112aba899ee8db0e
          path: .devtools-dependencies/setup-php-action
          persist-credentials: false

      - name: Set up Axolotl PHP environment
        shell: bash
        env:
          INPUT_PHP-VERSION: "8.1"
          INPUT_PM-VERSION-MAJOR: "5"
          INPUT_INSTALL-PATH: ./.php-bin
        run: node .devtools-dependencies/setup-php-action/dist/index.js

      - name: Lint experimental PHP source
        run: find src -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Test chat alias permissions and held-item NBT
        run: php tests/chat-alias.php

      - name: Analyze and build with pinned DevTools
        id: build
        uses: NhanAZ/DevTools@c735c409609cbf6a421394f5413ea803cd50e93b # v1.0.18
        with:
          project: .
          output: build
          phpstan: max
          phpstan-server: .devtools-dependencies/axolotl-pm

      - name: Verify experimental PHAR contents and digest
        shell: bash
        env:
          PHAR_PATH: ${{ steps.build.outputs.phar }}
          PHAR_SHA256: ${{ steps.build.outputs.sha256 }}
          BUILD_METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          set -euo pipefail
          test "$(sha256sum "$PHAR_PATH" | cut -d ' ' -f 1)" = "$PHAR_SHA256"
          php -r '$p=new Phar(getenv("PHAR_PATH")); foreach(["plugin.yml","LICENSE","resources/config.yml","src/NhanAZ/OhMyTest/Main.php","src/NhanAZ/OhMyTest/DumpAZ.php"] as $f){if(!$p->offsetExists($f)){throw new RuntimeException("Missing PHAR entry: ".$f);}}'
          cp "$BUILD_METADATA" build/build-metadata.json

      - name: Upload verified experimental PHAR
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OhMyTest-${{ github.sha }}
          path: |
            ${{ steps.build.outputs.phar }}
            build/build-metadata.json
          if-no-files-found: error
          retention-days: 14
